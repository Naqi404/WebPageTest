<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSN – Broken (Current)</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { font-size: 18px; padding: 10px; width: 100%; }
    .note { margin-top: 10px; color: #b00020; }
  </style>
</head>
<body>

<h2>SSN Input – Current Behavior (Broken)</h2>

<input
  type="text"
  placeholder="XXX-XX-XXXX"
  oninput="maskSSN(this)"
/>

<div class="note">
  Samsung Galaxy + Samsung Keyboard + Predictive Text ON<br/>
  Expected to truncate / autocorrect / fail
</div>

<script>
  function maskSSN(input) {
    // initialize per-input raw buffer
    if (!input._raw) {
      input._raw = '';
    }

    // get the last typed character (IME-safe enough for repro)
    const value = input.value;
    const lastChar = value[value.length - 1];

    // handle digit entry
    if (/\d/.test(lastChar) && input._raw.length < 9) {
      input._raw += lastChar;
    }

    // handle backspace/delete
    if (value.length < input._lastLength) {
      input._raw = input._raw.slice(0, -1);
    }

    input._lastLength = value.length;

    const d = input._raw;

    // build masked display (XXX-XX-0000)
    let masked = '';
    if (d.length > 0) masked += '*'.repeat(Math.min(3, d.length));
    if (d.length > 3) masked += '-' + '*'.repeat(Math.min(2, d.length - 3));
    if (d.length > 5) masked += '-' + d.slice(5);

    input.value = masked;
  }
</script>

</body>
</html>
