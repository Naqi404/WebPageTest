<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSN Keyboard Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .field {
      margin-bottom: 24px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <h2>SSN Input – Keyboard Behavior Test</h2>

  <!-- CURRENT BEHAVIOR -->
  <div class="field">
    <label>Current (type="text")</label>
    <input
      type="text"
      placeholder="XXX-XX-XXXX"
      pattern="\d{3}-?\d{2}-?\d{4}"
      oninput="maskSSN(this)"
    />
    <div class="note">
      This mimics the current Client Portal behavior.
    </div>
  </div>

  <!-- FIXED BEHAVIOR -->
  <div class="field">
    <label>Proposed Fix (type="tel" + IME disabled)</label>
    <input
      type="tel"
      inputmode="numeric"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="XXX-XX-XXXX"
      pattern="\d{3}-?\d{2}-?\d{4}"
      oninput="maskSSN(this)"
    />
    <div class="note">
      Predictive text disabled, numeric IME hinted.
    </div>
  </div>

  <script>
    function maskSSN(input) {
      let digits = input.value.replace(/\D/g, '').slice(0, 9);
      let formatted = '';

      if (digits.length > 0) formatted = digits.slice(0, 3);
      if (digits.length >= 4) formatted += '-' + digits.slice(3, 5);
      if (digits.length >= 6) formatted += '-' + digits.slice(5, 9);

      input.value = formatted;
    }
  </script>
</body>
</html>
